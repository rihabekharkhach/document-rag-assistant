name: document-rag

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      target: api
    image: document-rag-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      TESSERACT_CMD: /usr/bin/tesseract   # overrides the Windows path from your .env
    depends_on:
      - qdrant
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/app/data                           # documents, figures, history, vision cache
      - ${HF_CACHE_DIR:-hf_cache}:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s   # the first start loads the embedding model

  ui:
    build:
      context: .
      target: ui
    image: document-rag-ui:local
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"

volumes:
  qdrant_data:
  app_data:
  hf_cache: