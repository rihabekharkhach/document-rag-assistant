name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: poetry.lock
      - name: "Install dependencies (without the heavy ML stack: the tests stub the embedding model)"
        run: |
          pip install poetry poetry-plugin-export
          poetry export --only main,dev --without-hashes -o requirements.txt
          grep -v -E "^(nvidia-|triton|torch==|sentence-transformers|transformers|scikit-learn|scipy|tokenizers|safetensors)" requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt
      - name: Lint
        run: python -m ruff check app ui tests evaluation
      - name: Tests
        run: python -m pytest

  docker:
    needs: test
    Document RAG assistant: Docker Compose, CI/CD, tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=raw,value=latest
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}