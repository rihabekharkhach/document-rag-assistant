[tool.poetry]
name = "research-agent"
version = "0.1.0"
description = "Multi-agent RAG research assistant (Researcher -> Critic -> Writer, LangGraph)"
authors = ["Rihabe"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# Agent orchestration
langgraph = "^0.2.0"
langchain-core = "^0.3.0"
langchain-ollama = "^0.2.0"
langchain-community = "^0.3.0"

# RAG: chunking, embeddings, vector store
langchain-text-splitters = "^0.3.0"
sentence-transformers = "^3.1.0"
qdrant-client = "^1.11.0"

# Document loaders (text-based extraction)
pypdf = "^5.0.0"
docx2txt = "^0.8"

# Vision-language model extraction (scanned PDFs / images)
pillow = "^10.4.0"
pdf2image = "^1.17.0"

# Config
python-dotenv = "^1.0.0"
langchain-google-genai = "^2.1"
langchain-groq = "^0.3"
requests = "^2.34.2"
fastapi = "^0.143.1"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
ragas = "^0.4.3"
pymupdf = "^2.0"
pytesseract = "^0.3.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"